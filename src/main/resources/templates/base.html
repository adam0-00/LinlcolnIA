<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titre, contenu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${titre}">Lincoln</title>
    <link rel="icon" th:href="@{/img/Lincoln_icone.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/vendor/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4 flex-grow-1">
    <th:block th:replace="${contenu}"></th:block>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/vendor/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
